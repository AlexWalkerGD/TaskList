<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task List</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="panel">
        <h1> Task List</h1>
        <h2>Add your tasks!</h2>
        <input  type="text" id="task" maxlength="15" placeholder="Write your Task">
        <button onclick="addtask()" class="add">Add Task</button>
        <button onclick="clearList()" class="clear">Clear List</button>
        <h3 id="message"></h3>
        <ul id="list"></ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
